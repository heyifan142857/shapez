name: Build Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
            qt-host: linux
            artifact-name: shapez-linux-x86_64.tar.gz
          - name: windows
            os: windows-latest
            qt-host: windows
            artifact-name: shapez-windows-x86_64.zip
          - name: macos
            os: macos-latest
            qt-host: mac
            artifact-name: shapez-macos-universal.zip

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.2'
          host: ${{ matrix.qt-host }}
          target: desktop
          modules: qtmultimedia
          cache: true

      - name: Install Linux system dependencies
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-dev \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libpulse-mainloop-glib0 \
            patchelf

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Prepare packaged output
        shell: bash
        run: mkdir -p dist

      - name: Package Linux
        if: matrix.name == 'linux'
        shell: bash
        run: |
          mkdir -p dist/Shapez
          cp build/Shapez dist/Shapez/
          cp -r res dist/Shapez/
          cp README.md dist/Shapez/
          tar -czf dist/${{ matrix.artifact-name }} -C dist Shapez

      - name: Package Windows
        if: matrix.name == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/Shapez | Out-Null
          Copy-Item build/Release/Shapez.exe dist/Shapez/
          Copy-Item README.md dist/Shapez/
          Copy-Item res dist/Shapez/res -Recurse
          $windeployqt = (Get-Command windeployqt).Source
          & $windeployqt dist/Shapez/Shapez.exe --release --no-translations
          Compress-Archive -Path dist/Shapez/* -DestinationPath dist/${{ matrix.artifact-name }} -Force

      - name: Package macOS
        if: matrix.name == 'macos'
        shell: bash
        run: |
          mkdir -p dist
          macdeployqt build/Shapez.app -qmldir="$GITHUB_WORKSPACE"
          ditto -c -k --sequesterRsrc --keepParent build/Shapez.app dist/${{ matrix.artifact-name }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4.6.2
        with:
          name: ${{ matrix.name }}-release
          path: dist/${{ matrix.artifact-name }}

      - name: Upload release asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ matrix.artifact-name }}
          generate_release_notes: true
